<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #1A2332;
    color: #F7F5F0;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 25% 35%, rgba(39,174,96,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 65%, rgba(52,152,219,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(26,188,156,0.03) 0%, transparent 70%);
  }

  /* ── Canvas tela cheia ── */
  #mynetwork { margin-top: 0; height: 100vh !important; }

  /* ── Legenda ── */
  #k-legend {
    position: fixed; bottom: 20px; left: 20px; z-index: 1000;
    background: rgba(26,35,50,.92);
    border: 1px solid #2E3D52;
    border-radius: 8px;
    padding: 14px 16px;
    min-width: 192px;
    backdrop-filter: blur(8px);
    max-height: calc(100vh - 90px);
    overflow-y: auto;
  }
  #k-legend .leg-title {
    font-size: 11px; font-weight: 600;
    color: #b0b0b0;
    text-transform: uppercase; letter-spacing: .1em;
    margin-bottom: 10px;
  }
  .leg-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .leg-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .leg-label {
    font-size: 12px; color: #EBE8E2;
  }

  /* ── Painel de detalhe do nó ── */
  #k-detail {
    position: fixed;
    top: 0; right: 0;
    width: 320px;
    height: 100vh;
    background: rgba(20,29,43,.97);
    border-left: 1px solid #2E3D52;
    backdrop-filter: blur(12px);
    z-index: 999;
    transform: translateX(100%);
    transition: transform .25s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #k-detail.open { transform: translateX(0); }

  #k-detail-header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid #2E3D52;
    flex-shrink: 0;
  }
  #k-detail-close {
    position: absolute; top: 14px; right: 14px;
    background: none; border: none; cursor: pointer;
    color: #6B7B8D; font-size: 18px; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
    transition: color .15s, background .15s;
  }
  #k-detail-close:hover { color: #F7F5F0; background: #2E3D52; }

  #k-detail-title {
    display: flex; align-items: center; gap: 9px;
    padding-right: 28px;
  }
  #k-detail-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  #k-detail-name {
    font-size: 14px; font-weight: 600;
    color: #F7F5F0;
    word-break: break-word;
  }
  #k-detail-meta {
    margin-top: 8px; display: flex; align-items: center; gap: 8px;
  }
  #k-detail-type {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
    color: #b0b0b0;
    background: rgba(199,217,38,.1);
    border: 1px solid rgba(199,217,38,.25);
    padding: 2px 8px; border-radius: 20px;
  }
  #k-detail-degree {
    font-size: 11px; color: #6B7B8D;
  }

  #k-detail-body {
    padding: 16px 18px;
    overflow-y: auto;
    flex: 1;
  }
  #k-detail-desc {
    font-size: 13px; line-height: 1.65;
    color: #EBE8E2;
    white-space: pre-wrap;
  }

  /* ── Sobrescreve borda do pyvis / Bootstrap ── */
  #mynetwork,
  #mynetwork.card-body,
  .card,
  .card-body {
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
    padding: 0 !important;
  }

  /* ── Loading bar: fundo escuro ── */
  #loadingBar { background-color: rgba(26,35,50,.92) !important; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2E3D52; border-radius: 2px; }

  /* ── Vis.js tooltip override ── */
  .vis-tooltip {
    background: transparent !important;
    border: none !important;
    box-shadow: 0 4px 24px rgba(0,0,0,.5) !important;
    padding: 0 !important;
  }
</style>

<script>
  const NODE_DATA = {"Manejo-BBS.pdf": {"desc": "Manejo-BBS.pdf is a comprehensive document that serves as the management plan for the Balnéario Barra do Sul permanent preservation area. It outlines various measures aimed at the restoration and management of mangrove ecosystems, highlighting the ecological importance of these environments.\n\nThe document includes information on ecological restoration and monitoring practices, addressing strategies that are crucial for the sustainability of the mangrove habitats. It discusses project management guidelines and activities for a carbon restoration project, emphasizing the role of carbon credits and sustainable practices as key components for environmental conservation.\n\nAdditionally, Manejo-BBS.pdf encompasses a range of corrective actions and emergency response protocols tailored to the management and restoration activities within the preservation area. It also sheds light on the ecological and social project plans that relate to the overarching conservation efforts for the mangrove ecosystems.\n\nFurther, the document presents methodologies, outcomes, and recommendations for various environmental projects, serving as a model for future initiatives and establishing frameworks for accountability. Thus, Manejo-BBS.pdf is a vital resource that integrates both ecological and management perspectives for preserving mangrove ecosystems and promoting sustainable practices in the region.", "etype": "content", "degree": 9, "color": "#EBE8E2"}, "Balnéario Barra do Sul": {"desc": "Balnéario Barra do Sul is a designated permanent preservation area being managed for ecological restoration.", "etype": "location", "degree": 5, "color": "#52BE80"}, "Karaguá Ecotech": {"desc": "Karaguá Ecotech is a private company dedicated to promoting socio-environmental impact by managing and implementing Blue Carbon projects primarily in mangrove regions such as Santa Catarina. The organization plays a crucial role in developing innovative environmental conservation methods and producing documentation that supports sustainable practices within coastal communities.\n\nOne of the key focuses of Karaguá Ecotech is to convert the conservation of mangroves into economic activities that benefit local communities. The company's engagement in the carbon credit market is particularly significant; it operates in the higher value segment associated with blue carbon credits derived from coastal ecosystems. This includes activities such as the certification and sale of these carbon credits, environmental monitoring, and dedicated mangrove restoration efforts. Through these initiatives, Karaguá Ecotech aims to provide direct financial benefits to coastal communities for their active involvement in maintaining and enhancing these vital ecosystems.\n\nThe company is also noted for its collaboration through programs like the PSA Comunitário project, which underscores a strong partnership with local governments and community stakeholders. This collaboration facilitates community engagement through various technology and education initiatives, enhancing environmental conditions while fostering local participation.\n\nIn addition to its conservation and community engagement endeavors, Karaguá Ecotech conducts its operations within the legal framework for environmental services. It employs methodologies recognized by Verra for carbon credit certification and utilizes field monitoring technology overseen by a technical team of engineers. The company's commitment to sustainability is reflected in its structured funding initiatives associated with climate projects and technological education, further reinforcing its role as a significant player in the promotion of ecological preservation and socio-environmental benefits in its operational areas.<SEP>Karaguá Ecotech is a company that produces ecological impact through its model, focusing on climate, ecology, social, and technological dimensions.<SEP>Karaguá Ecotech is an organization involved in partnerships and projects related to ecology and technology.<SEP>Karaguá Ecotech is a company that operates with a technical team focused on governance based on territorial co-responsibility among businesses, municipalities, and communities.<SEP>Karaguá Ecotech is a company focused on environmental expansion plans, specifically involving Blue Carbon models and restoration efforts in mangrove areas.<SEP>Karaguá Ecotech is a socio-environmental impact company focused on carbon credit certification in coastal mangroves of Santa Catarina.<SEP>Karaguá Ecotech is a private company focused on socio-environmental impact, structuring blue carbon projects in coastal mangrove areas of Santa Catarina.", "etype": "organization", "degree": 65, "color": "#b0b0b0"}, "João Pedro Patrício do Nascimento": {"desc": "João Pedro Patrício do Nascimento is a contributor to the management plan for Balnéario Barra do Sul.<SEP>João Pedro Patrício do Nascimento is an author contributing to the elaboration of conservation documents.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Lucas Cunha Melo": {"desc": "Lucas Cunha Melo is a contributor to the management plan for Balnéario Barra do Sul.<SEP>Lucas Cunha Melo is an author contributing to the elaboration of conservation documents.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Restauração Ecológica": {"desc": "Restauração Ecológica refers to the ecological restoration objectives outlined in the management plan.<SEP>A Restauração Ecológica refere-se a medidas específicas necessárias para preservar e recuperar o manguezal.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Monitoramento Ecológico": {"desc": "Monitoramento Ecológico pertains to the monitoring goals specified in the management plan.<SEP>Monitoramento Ecológico is the continuous ecological monitoring process carried out to track the restoration progress of the manguezal.", "etype": "concept", "degree": 4, "color": "#95A5A6"}, "Restauração Passiva": {"desc": "Restauração Passiva, or natural assisted regeneration, is a method described in the management plan for ecological restoration.", "etype": "method", "degree": 0, "color": "#85929E"}, "Restauração Ativa": {"desc": "Restauração Ativa involves active restoration through planting seedlings and direct interventions.<SEP>Restauração Ativa refers to the large-scale active restoration efforts planned for Ano 2, involving extensive planting.", "etype": "method", "degree": 4, "color": "#85929E"}, "Programa de Monitoramento Contínuo": {"desc": "Programa de Monitoramento Contínuo outlines the continuous monitoring program established in the management plan.<SEP>Programa de Monitoramento Contínuo is an ecological monitoring program aimed at evaluating and guiding restoration actions.", "etype": "method", "degree": 2, "color": "#85929E"}, "PSA Comunitário Karaguá Vivo": {"desc": "PSA Comunitário “Karaguá Vivo” refers to community involvement in payments for ecosystem services linked to the management plan.<SEP>PSA Comunitário “Karaguá Vivo” is a community engagement project aimed at remunerating local residents for environmental conservation and monitoring activities in the mangrove ecosystem.", "etype": "concept", "degree": 5, "color": "#95A5A6"}, "Certificação de Créditos de Carbono": {"desc": "Certificação de Créditos de Carbono relates to the certification of carbon credits as part of the conservation effort.", "etype": "concept", "degree": 0, "color": "#95A5A6"}, "Ano 1": {"desc": "Ano 1 refers to the first year of activities planned for the restoration process in the management plan.<SEP>Ano 1 refers to the first year of the project's timeline, laying the groundwork for monitoring and verification activities.<SEP>Ano 1 refers to the first year of the carbon restoration project, involving the coordination of activities and results compilation.<SEP>Ano 1 includes the validation and registration phases for the project, which are critical for measuring the carbon credits later issued.", "etype": "timeperiod", "degree": 4, "color": "#7FB3D3"}, "Ano 2": {"desc": "Ano 2 denotes the second year of activities focused on the full implementation of the restoration plan.<SEP>Ano 2 refers to the second year of monitoring during which data collection and carbon verification occurs for the project.<SEP>Ano 2 refers to the second year of the carbon restoration project, focusing on full implementation of restoration activities.<SEP>Ano 2 represents the second year of the project, focusing on the formal quantification of carbon and further project progress evaluation.", "etype": "timeperiod", "degree": 6, "color": "#7FB3D3"}, "Ano 3": {"desc": "Ano 3 indicates the third year designated for consolidation and preparation for long-term sustainability of the project.<SEP>Ano 3 refers to the third year when verification of carbon data will be conducted following the first period of monitoring.<SEP>Ano 3 refers to the third year of a project focusing on consolidation and long-term preparation related to mangrove restoration.<SEP>Ano 3 refers to the timeframe within which certain project milestones related to carbon verification and credits are expected to be achieved.", "etype": "concept", "degree": 6, "color": "#95A5A6"}, "Área de Preservação Permanente": {"desc": "A Área de Preservação Permanente é uma área de manguezal em Balneário Barra do Sul, importante para a vida marinha e a biodiversidade local.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Balneário Barra do Sul": {"desc": "Balneário Barra do Sul is a municipality in Brazil known for its ecological significance, particularly as the site of the Permanent Preservation Area for mangroves. It plays a crucial role in innovative coastal conservation efforts aimed at achieving sustainable socio-economic development. The municipality is actively involved in a mangrove restoration project that enhances its commitment to ecological preservation by integrating funding through carbon credits, which also fosters community engagement.\n\nThe mangrove restoration initiative is noteworthy for its dual focus on environmental sustainability and the well-being of local residents. This approach not only aims to improve the local ecosystem but also to involve the community in meaningful ways. Balneário Barra do Sul hosts a pilot project managed by Karaguá Ecotech, covering an extensive area of 380 hectares designated for carbon credit generation. This project serves as a practical example of sustainable ecological practices and acts as a hub for educational and community initiatives, aimed at promoting awareness and increasing local participation.\n\nMoreover, Balneário Barra do Sul is the initial pilot location for Karaguá Ecotech's expansion plan, emphasizing its integral role in community and educational integration projects. Beyond the mangrove restoration efforts, it is home to various community projects, including a 3D printing laboratory, which signifies the municipality's commitment to fostering innovation and engaging the local populace in various developmental initiatives. Overall, Balneário Barra do Sul stands as a model municipality for mangrove conservation and demonstrates a strong emphasis on community participation in environmental efforts, furthering ecological integrity in the region.", "etype": "location", "degree": 14, "color": "#52BE80"}, "Canal do Linguado": {"desc": "O Canal do Linguado abriga remanescentes de manguezais no município de Balneário Barra do Sul.<SEP>Canal do Linguado is a waterway connecting the Lagoa Maria Fernanda and the delta of the river Perequê to the estuarine complex of Baía da Babitonga.", "etype": "location", "degree": 2, "color": "#52BE80"}, "Manguezal": {"desc": "Manguezal refers to a vital mangrove ecosystem that plays a crucial role in marine life support, environmental services, and climate change mitigation. This coastal ecosystem functions as a nursery for various marine species and is integral to biodiversity maintenance. Currently, Manguezal is undergoing restoration efforts aimed at recovering its ecological integrity and enhancing its functionality. These efforts are essential due to significant challenges faced by the ecosystem, including degradation from illegal activities and adverse environmental factors.\n\nMonitoring initiatives have been implemented to assess the ecological significance of the mangrove areas and gauge the progress of restoration efforts. Manguezal is specifically the focus of conservation endeavors, including the PSA project, which seeks to preserve and restore this important ecosystem. Furthermore, it is part of a carbon credit project that highlights its capacity for carbon storage, emphasizing its role in climate change mitigation strategies.\n\nAdditionally, Manguezal is recognized for its community value and is actively involved in education and community engagement activities. It is a coastal environment of high climatic relevance, respected for its ecological importance and its contributions to both biodiversity and habitat preservation. Overall, Manguezal represents a crucial ecological zone that is not only being conserved and restored but also monitored to ensure its sustainability and resilience against environmental degradation.", "etype": "naturalobject", "degree": 45, "color": "#1ABC9C"}, "Mata Atlântica": {"desc": "A Mata Atlântica é o bioma ao qual pertence o manguezal de Balneário Barra do Sul, classificado como área prioritária para conservação.<SEP>Mata Atlântica, or Atlantic Forest, is a critical biome that the manguezal integrates, highlighting its ecological importance.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Diagnóstico Socioambiental": {"desc": "O Diagnóstico Socioambiental é um estudo recente que identificou pontos críticos para a conservação do manguezal.<SEP>Diagnóstico Socioambiental is a socio-environmental diagnosis of the municipality that identifies significant impacts on mangrove ecosystems.", "etype": "concept", "degree": 3, "color": "#95A5A6"}, "Peixes e Crustáceos": {"desc": "Peixes e crustáceos são especies de interesse pesqueiro que habitam os manguezais, funcionando como parte de seu ecossistema.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "Serviços Ambientais": {"desc": "Serviços Ambientais referem-se às funções que o ecossistema de manguezal provê, como depuração da água e sequestro de carbono.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Carbono Azul": {"desc": "Carbono azul é um termo que descreve o potencial de sequestro de carbono dos ecossistemas de mangue, mais eficiente que outros biomas.<SEP>Carbono Azul refers to the carbon credits associated with carbon storage in coastal ecosystems like mangroves.<SEP>Carbono Azul represents a national reference in solutions that connect various elements including mangroves and technology for environmental and social benefits.<SEP>Carbono Azul refers to the concept of using coastal ecosystems like mangroves to capture and store carbon, addressing climate change while supporting local communities.<SEP>Carbono Azul refers to the ecological and economic benefits derived from blue carbon ecosystems such as mangroves, highlighting their importance in environmental strategies.<SEP>Carbono Azul refers to the community and technical model validated by Karaguá Ecotech for carbon credit generation from mangrove ecosystems.<SEP>Carbono Azul represents carbon stored and sequestered in coastal and marine environments, distinguishing Karaguá's assets from conventional forest carbon credits.", "etype": "concept", "degree": 4, "color": "#95A5A6"}, "Serviços Ecossistêmicos": {"desc": "Serviços Ecossistêmicos refers to the benefits provided by the manguezal, including acting as a nursery for aquatic species and a natural barrier against extreme weather events.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Comunidade Local": {"desc": "Comunidade Local involves the local population engaged in environmental management and restoration actions of the manguezal.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Educação Ambiental": {"desc": "Educação Ambiental is focused on raising awareness and knowledge about environmental issues relating to the restoration of the manguezal.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "UDESC": {"desc": "Universidade do Estado de Santa Catarina (UDESC) is a higher education institution that plays an active role in partnerships focused on ecological studies and sustainable management, particularly concerning mangrove ecosystems. This university is deeply involved in various scientific initiatives, including significant support for restoration projects aimed at environmental conservation.\n\nIn collaboration with Karaguá Ecotech, UDESC contributes to educational outreach efforts specifically tailored for communities in the areas of Joinville and Balneário Barra do Sul. This partnership not only fosters academic integration but also facilitates knowledge production in the field of environmental studies. UDESC is recognized as one of the key academic partners in the projects associated with Karaguá Ecotech, involving scholarships and applied research initiatives.\n\nThrough its research and extension projects, UDESC emphasizes its commitment to environmental conservation, contributing to a broader understanding of sustainable practices and their implementation in local ecosystems. The university's involvement showcases a dedication to scientific advancement and community education, underscoring its position as a pivotal player in ecological research and environmental stewardship in the region.<SEP>UDESC is a local university involved in Karaguá Ecotech's project for community engagement in environmental monitoring and restoration efforts.", "etype": "organization", "degree": 4, "color": "#b0b0b0"}, "Univille": {"desc": "Univille is a university located in Brazil that actively engages in various research partnerships and educational initiatives, particularly focused on ecological studies, especially concerning mangrove areas. The institution collaborates with Karaguá Ecotech, emphasizing environmental issues and supporting scientific restoration projects. These collaborations aim to integrate local educational efforts, involving local students in research and practical applications concerning environmental sustainability.\n\nUniville is noted for its academic partnerships within the region, facilitating collaborative projects that enhance the understanding of manguezal ecosystems. The university's involvement not only strengthens scientific research but also fosters educational development, promoting community engagement in environmental education related to ongoing initiatives. Overall, Univille plays a significant role as a higher education institution committed to ecological research and restoration efforts within its locality.<SEP>Univille is another university partnering with Karaguá Ecotech, contributing to project initiatives.<SEP>Univille is a local university participating in the Karaguá Ecotech project along with UDESC to support community engagement.", "etype": "organization", "degree": 4, "color": "#b0b0b0"}, "Pagamentos por Serviços Ambientais (PSA)": {"desc": "Pagamentos por Serviços Ambientais (PSA) are payments linked to the ecological services provided by the manguezal, incentivizing local preservation efforts.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Integridade Ecológica": {"desc": "Integridade Ecológica refers to the ecological integrity of the manguezal, encompassing the recovery of its structure and function.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Biodiversidade Local": {"desc": "Biodiversidade Local involves the variety of native species in the manguezal, which is expected to increase with restoration efforts.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Cobrimento Vegetal": {"desc": "Cobrimento Vegetal refers to the vegetation coverage in the manguezal, which is an important indicator for monitoring restoration success.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Recrutamento de Plântulas": {"desc": "Recrutamento de Plântulas involves the recruitment of seedlings in the manguezal as part of the ecosystem's recovery process.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Preservação da Linha de Costa": {"desc": "Preservação da Linha de Costa is aimed at protecting the coastal line from erosion and flooding thanks to the manguezal restoration.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Manguezal de Balneário Barra do Sul": {"desc": "The Manguezal de Balneário Barra do Sul is a significant remnant of mangrove vegetation located in the estuarine region, covering approximately 380 hectares and serving as a critical habitat for various species.", "etype": "naturalobject", "degree": 10, "color": "#1ABC9C"}, "Lagoa Maria Fernanda": {"desc": "Lagoa Maria Fernanda is a lagoon that is part of the estuarine ecosystem connected to the Manguezal de Balneário Barra do Sul.<SEP>Lagoa Maria Fernanda is a geographic area where the manguezal is located and is subject to conservation efforts.<SEP>Lagoa Maria Fernanda is a specific location targeted for mangrove restoration efforts within the document.", "etype": "location", "degree": 2, "color": "#52BE80"}, "Baía da Babitonga": {"desc": "Baía da Babitonga is an estuarine bay located in northern Santa Catarina, Brazil, and is recognized as the largest estuary in the region. This bay forms part of the aquatic system linked to the Manguezal de Balneário Barra do Sul and is characterized by its extensive mangrove area, which is crucial for maintaining ecological balance. Stretching across 6,000 to 8,000 hectares, the mangroves of Baía da Babitonga are biologically significant, serving as a habitat for various marine species and playing a vital role in their reproduction.\n\nThe bay is not only ecologically important but also serves as a model for conservation and value generation, both for society and the market. It is targeted for scalable Blue Carbon models, highlighting its potential in carbon credit projects. Specifically, Baía da Babitonga is the focal point for projects such as the expansion of Karaguá’s mangrove restoration initiatives, which aim to restore and monitor up to 8,000 hectares of mangrove ecosystems.\n\nEfforts are being made to expand the mangrove cover in Baía da Babitonga, thereby enhancing biodiversity conservation priorities in the area. The ongoing projects signify the bay's importance in addressing environmental challenges while benefiting local communities. Overall, Baía da Babitonga is a critical area for both ecological conservation and sustainable development initiatives in Santa Catarina.<SEP>Baía da Babitonga is the largest estuary in Santa Catarina, targeted for expansion of mangrove restoration efforts, estimated at 6,000 to 8,000 hectares.", "etype": "location", "degree": 14, "color": "#52BE80"}, "Rhizophora Mangle": {"desc": "Rhizophora Mangle, known as mangue-vermelho, is a predominant species within the mangrove ecosystem of Balneário Barra do Sul.<SEP>Rhizophora Mangle, also known as mangue-vermelho, is a species of mangrove that requires specific planting techniques for successful growth.", "etype": "creature", "degree": 2, "color": "#2ECC71"}, "Avicennia Schaueriana": {"desc": "Avicennia Schaueriana, referred to as mangue-siriúba or mangue-preto, is another key species found in the mangrove area.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Laguncularia Racemosa": {"desc": "Laguncularia Racemosa, also known as mangue-branco, is a significant mangrove species contributing to the vegetative associations of the manguezal.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Ecossistema": {"desc": "The manguezal is described as an ecosystem of high strategic value, contributing to environmental connectivity and providing multiple ecological services.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Aterros": {"desc": "Aterros refers to landfills or fill areas that obstruct tidal flow, affecting the hydrology of the mangrove system.", "etype": "concept", "degree": 0, "color": "#95A5A6"}, "Impactos Significativos": {"desc": "Impactos Significativos refers to the significant impacts identified in the socio-environmental diagnosis that threaten the mangroves.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Usos Inadequados": {"desc": "Usos Inadequados pertains to inappropriate uses and disturbances by humans that affect the mangrove ecosystem.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Manejo-BBS": {"desc": "Manejo-BBS is a document focusing on environmental management and restoration strategies, particularly concerning mangrove ecosystems.<SEP>Manejo-BBS is a PDF document that contains information on environmental management practices, specifically regarding water flow correction and invasive species control.<SEP>Manejo-BBS is a document focused on carbon credit management and monitoring processes related to coastal ecosystems.<SEP>Manejo-BBS is a document detailing strategic environmental actions and interventions related to a restoration project.<SEP>Manejo-BBS is a document containing information about a project focused on the restoration of mangroves, including community participation and environmental management strategies.<SEP>Manejo-BBS is a document discussing the management and restoration of ecosystems, focusing on innovative practices and community engagement.", "etype": "content", "degree": 7, "color": "#EBE8E2"}, "Parque Natural Municipal do Encanto": {"desc": "Parque Natural Municipal do Encanto is a proposed protected area aimed at preserving the local mangrove ecosystem.<SEP>Parque Natural Municipal do Encanto is a mangrove conservation area established as part of a project to ensure sustainable management of environmental resources.<SEP>Parque Natural Municipal do Encanto is a protected area being established for the integral protection of mangroves in Balneário Barra do Sul.", "etype": "location", "degree": 11, "color": "#52BE80"}, "Ecological Mangrove Restoration": {"desc": "Ecological Mangrove Restoration is a methodology that combines passive and active approaches to restore mangrove ecosystems.", "etype": "method", "degree": 2, "color": "#85929E"}, "Recuperação Hidrológica": {"desc": "Recuperação Hidrológica is a restoration action focused on improving water circulation by removing obstructions to tidal flow.", "etype": "method", "degree": 1, "color": "#85929E"}, "APP": {"desc": "APP refers to Área de Preservação Permanente, indicating the legal protection status of mangrove areas under environmental laws.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Unidade de Conservação": {"desc": "Unidade de Conservação is a conservation unit that aims to provide legal protection and governance for environmental preservation.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "PSA Local": {"desc": "PSA Local refers to Payment for Environmental Services at the local level, addressing financial incentives related to environmental conservation.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Mangrove": {"desc": "Mangrove refers to a coastal ecosystem characterized by salt-tolerant trees, essential for environmental health and biodiversity.<SEP>Mangroves are coastal ecosystems characterized by salt-tolerant trees and are a focus of restoration efforts discussed in the text.", "etype": "naturalobject", "degree": 5, "color": "#1ABC9C"}, "Community": {"desc": "The community refers to local residents who can participate in the restoration efforts, including cleaning and planting activities.<SEP>Community refers to the local population that will support the conservation project through ongoing participation.", "etype": "person", "degree": 3, "color": "#E85D4A"}, "Rhizophora": {"desc": "Rhizophora is a genus of mangrove trees whose propagules can be collected for restoration purposes.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "Avicennia": {"desc": "Avicennia is another genus of mangrove species known for its ecological importance and also provides propagules for planting.<SEP>Avicennia refers to a type of mangrove, specifically known as mangue-preto, which also requires careful planting techniques.", "etype": "creature", "degree": 2, "color": "#2ECC71"}, "Laguncularia": {"desc": "Laguncularia is a genus of mangrove plant that is significant in mangrove ecosystems and can be propagated for restoration.<SEP>Laguncularia is another species of mangrove, recognized as mangue-branco, which is cared for through specified planting procedures.", "etype": "creature", "degree": 2, "color": "#2ECC71"}, "Active Restoration": {"desc": "Active Restoration involves hands-on techniques such as planting native mangrove species to speed up recovery in areas with slow natural regeneration.", "etype": "concept", "degree": 4, "color": "#95A5A6"}, "Passive Measures": {"desc": "Passive Measures refer to activities aimed at improving habitat conditions, allowing for natural regeneration of mangroves.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Dique de Terra": {"desc": "Dique de Terra is an ancient earth dam that may obstruct water flow and requires removal as part of restoration efforts.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "Poça Isolada": {"desc": "Poça Isolada is a isolated pool that should be connected back to the main channel as part of the ecological restoration.", "etype": "naturalobject", "degree": 0, "color": "#1ABC9C"}, "Resíduos": {"desc": "Resíduos refers to waste materials that accumulate in mangrove areas and need to be cleaned up during restoration activities.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "Placas de Conscientização": {"desc": "Placas de Conscientização are informational signs intended to raise awareness about protecting mangrove environments.", "etype": "artifact", "degree": 1, "color": "#8E44AD"}, "Viveiro Comunitário": {"desc": "Viveiro Comunitário refers to a simple community nursery that can generate plant seedlings and serve as an environmental education activity and temporary income for participants.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Mudas": {"desc": "Mudas are plant seedlings that are generated in the community nursery and need to be properly maintained for successful transplantation.<SEP>Mudas are seedlings used in the restoration activities during the project to enhance vegetation cover.", "etype": "naturalobject", "degree": 5, "color": "#1ABC9C"}, "Áreas de Clareiras": {"desc": "Áreas de Clareiras are areas identified for planting where natural regeneration has not occurred after hydrological improvements.", "etype": "location", "degree": 1, "color": "#52BE80"}, "Técnicas de Plantio": {"desc": "Técnicas de Plantio includes established techniques for planting specific species effectively in their respective environments.", "etype": "method", "degree": 4, "color": "#85929E"}, "Manutenção Pós-Plantio": {"desc": "Manutenção Pós-Plantio entails post-planting maintenance practices to monitor and ensure the survival of the planted seedlings.", "etype": "method", "degree": 2, "color": "#85929E"}, "Água Salobra": {"desc": "Água Salobra is a type of saline water used for irrigation in the nursery, which helps in the growth of seedlings.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "Tempo Estável": {"desc": "Tempo Estável refers to stable weather conditions that facilitate the establishment of seedlings after planting.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Restauração de Manguezais": {"desc": "Restauração de Manguezais is a specialized field focused on the restoration of mangrove ecosystems utilizing various techniques.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Restauracão do Manguezal": {"desc": "Restauracão do Manguezal refers to efforts for the ecological restoration of mangrove areas.", "etype": "concept", "degree": 5, "color": "#95A5A6"}, "Cobertura Vegetal do Manguezal": {"desc": "Cobertura Vegetal do Manguezal is an indicator that measures the area and density of mangrove coverage.", "etype": "data", "degree": 2, "color": "#BDC3C7"}, "Sobrevivência e Crescimento das Mudas Plantadas": {"desc": "Sobrevivência e Crescimento das Mudas Plantadas is an indicator assessing the survival rate and growth of planted seedlings.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Qualidade da Água e Solo": {"desc": "Qualidade da Água e Solo encompasses indicators related to the salinity and oxygen levels in the water and soil necessary for mangrove health.", "etype": "data", "degree": 2, "color": "#BDC3C7"}, "Indicadores-Chave": {"desc": "Indicadores-Chave refers to key indicators selected to reflect the goals of ecological restoration and ecosystem services.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Recuperação da Estrutura Florestal": {"desc": "Recuperação da Estrutura Florestal refers to the restoration of the forest structure within the mangrove ecosystem.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Hectares": {"desc": "Hectares is a unit of measurement used to describe the area covered by mangrove canopies.", "etype": "data", "degree": 0, "color": "#BDC3C7"}, "Transparência da Água": {"desc": "Transparência da Água is an indicator related to the clarity of water, which can reflect organic matter levels in ecological monitoring.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Fauna Bentônica": {"desc": "Fauna bentônica refers to the benthic fauna associated with mangroves, serving as a bioindicator of functional recovery.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Caranguejos-Uçá": {"desc": "Caranguejos-uçá are a type of crab that are monitored in studies related to mangrove habitat recovery.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Siris": {"desc": "Siris are a type of crab included in the monitoring of mangrove recovery through the density of their burrows.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Peixes Juvenis Estuarinos": {"desc": "Peixes juvenis estuarinos consist of juvenile estuarine fish that are assessed for abundance and diversity in restored areas.", "etype": "creature", "degree": 2, "color": "#2ECC71"}, "Avifauna": {"desc": "Avifauna includes aquatic and mangrove birds that are periodically censused to monitor the ecological recovery of mangrove habitats.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Garças": {"desc": "Garças are a type of bird expected to increase in population as the mangrove ecosystem recovers.", "etype": "creature", "degree": 0, "color": "#2ECC71"}, "Maçaricos": {"desc": "Maçaricos are shorebirds that are anticipated to appear more frequently as the mangrove ecosystem improves.", "etype": "creature", "degree": 0, "color": "#2ECC71"}, "Programa de PSA": {"desc": "Programa de PSA refers to a program aimed at engaging families in environmental conservation efforts within mangrove areas.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Guardiões do Mangue": {"desc": "Guardiões do Mangue are guardians responsible for the removal of waste from mangrove areas.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Atividades de Educação Ambiental": {"desc": "Atividades de educação ambiental involve educational activities held within the mangrove for schools and volunteers.", "etype": "concept", "degree": 0, "color": "#95A5A6"}, "Métodos de Coleta de Dados": {"desc": "Métodos de coleta de dados are specified plans for monitoring indicators in the mangrove area restoration project.", "etype": "method", "degree": 1, "color": "#85929E"}, "Parcelas Permanentes de Vegetação": {"desc": "Parcelas permanentes de vegetação are fixed plots used to evaluate plant density, young tree height, canopy coverage, and key species presence.", "etype": "method", "degree": 2, "color": "#85929E"}, "Transectos para Fauna Bentônica": {"desc": "Transectos para fauna bentônica are designated areas where activities related to crab burrows and biological activity in sediments are monitored.", "etype": "method", "degree": 0, "color": "#85929E"}, "Estuarine Fish": {"desc": "Estuarine fish are species of fish commonly found in estuaries that can be monitored as part of ecological assessments in restored areas.", "etype": "creature", "degree": 0, "color": "#2ECC71"}, "Densidade de Tocas": {"desc": "Densidade de tocas refers to the density of crab burrows used as an indicator in assessing the recovery of habitats.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Tocas de Caranguejo": {"desc": "Tocas de caranguejo are crab burrows counted to monitor the recovery of benthic fauna in exposed areas of the mangrove.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Cobertura do Dossel": {"desc": "Cobertura do dossel indicates the canopy cover assessed during monitoring of vegetation recovery within the mangrove ecosystem.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Coletas Físico-Químicas": {"desc": "Coletas Físico-Químicas refer to monthly monitoring of the salinity of water and soil at fixed points using specific equipment.", "etype": "method", "degree": 2, "color": "#85929E"}, "Refratômetro": {"desc": "Refratômetro is an instrument used to measure the salinity of water as part of the physical-chemical collections.", "etype": "equipment", "degree": 1, "color": "#A569BD"}, "Sonda": {"desc": "Sonda is a device utilized to measure dissolved oxygen in water during monitoring activities.", "etype": "equipment", "degree": 1, "color": "#A569BD"}, "Kit de Campo": {"desc": "Kit de Campo is a field kit used for basic measurements of water quality parameters.", "etype": "equipment", "degree": 0, "color": "#A569BD"}, "PSA": {"desc": "Payment for Environmental Services (PSA) encompasses multiple frameworks and concepts aimed at promoting environmental sustainability through community engagement and financial incentives. PSA incorporates both Participatory Social Assessment and Participatory Social Agreement, which emphasize the involvement of community members in monitoring and data collection for environmental initiatives. \n\nPayment for Environmental Services specifically refers to a financial mechanism designed to compensate individuals or communities for delivering ecological services that enhance societal welfare. This approach is evident in projects where local residents, including fishermen, are incentivized to participate in activities such as monitoring and restoring mangroves. \n\nIn Brazil, PSA is recognized as Pagamento por Serviços Ambientais, serving as a crucial tool for sustainable development, engaging families in local cleanliness and broader environmental protection initiatives. These frameworks not only aim to restore and protect ecosystems but also foster a sense of community responsibility and participation in environmental stewardship. \n\nOverall, PSA embodies a dual focus on environmental restoration and community empowerment, leveraging economic incentives to align local interests with ecological health.", "etype": "concept", "degree": 6, "color": "#95A5A6"}, "Google Sheets": {"desc": "Google Sheets is a centralized spreadsheet used for recording collected data from monitoring activities.", "etype": "data", "degree": 2, "color": "#BDC3C7"}, "Sistema de Informação Geográfica (SIG)": {"desc": "SIG refers to a geographic information system that integrates collected data for real-time visualization and analysis.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Leaflet.js": {"desc": "Leaflet.js is a JavaScript library developed for creating interactive maps linked to data bases for monitoring visualization.", "etype": "method", "degree": 1, "color": "#85929E"}, "Indicadores Críticos": {"desc": "Indicadores Críticos are key indicators such as salinity and area integrity that require monthly monitoring.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Gestão Adaptativa": {"desc": "Gestão Adaptativa is a management principle that involves ongoing adjustments to monitoring data to inform maintenance actions.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Meio Ambiente": {"desc": "Meio Ambiente is the environmental authority involved in overseeing data collection and monitoring efforts for the ecosystem.", "etype": "organization", "degree": 0, "color": "#b0b0b0"}, "Delineamento": {"desc": "Delineamento refers to the delineation of monitoring areas as per the DSA standards, crucial for effective data collection and management.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Pontos de Monitoramento": {"desc": "Pontos de Monitoramento are specific fixed points where water and soil salinity measurements are made during the monitoring process.", "etype": "location", "degree": 1, "color": "#52BE80"}, "Secretaria de Meio Ambiente": {"desc": "Google Sheets is shared with the Secretaria de Meio Ambiente for collaboration on data management and monitoring.<SEP>Secretaria de Meio Ambiente is the government department responsible for environmental affairs in the municipality, involved in managing environmental restoration programs.", "etype": "organization", "degree": 2, "color": "#b0b0b0"}, "Espécies Invasoras": {"desc": "Espécies invasoras refer to non-native species that may disrupt local ecosystems, as mentioned in the context of managing water flow and ecological health.<SEP>Espécies Invasoras refers to invasive species that pose threats to the success of the restoration project.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "PSA (Pagamento por Serviços Ambientais)": {"desc": "PSA stands for Pagamento por Serviços Ambientais, a payment scheme designed to incentivize local communities for their roles in environmental protection activities.<SEP>PSA is a payment program for environmental services aimed at financing ecological restoration and community involvement in conservation efforts.", "etype": "concept", "degree": 4, "color": "#95A5A6"}, "Karaguá Vivo": {"desc": "Karaguá Vivo is a prominent local program associated with the Payment for Environmental Services (PSA) initiative, primarily focused on the conservation and restoration of mangrove ecosystems. This program emphasizes community involvement by providing financial incentives for local residents to participate in environmental activities, thus promoting sustainable management of natural resources.\n\nAs a pilot program, Karaguá Vivo serves as a foundational model for the PSA Manguezal program in Balneário Barra do Sul. It is implemented by Karaguá Ecotech, which strives to create a benchmark for Blue Carbon actions in the region of Santa Catarina. The central aim of Karaguá Vivo is to engage community members in the restoration of mangrove functions through several strategic approaches, including prioritized area selection, supervised planting, and continuous technical monitoring.\n\nKaraguá Vivo is recognized for its role as the main program for monitoring and restoring mangrove ecosystems while actively involving community members who receive compensation for their participation. This multi-faceted approach ensures not only the ecological restoration of mangrove areas but also the economic benefit and engagement of local communities in environmental stewardship.<SEP>Karaguá Vivo is the main program of Karaguá, structured in two phases aimed at community training and active restoration of mangrove areas.", "etype": "method", "degree": 10, "color": "#85929E"}, "Autoridades Competentes": {"desc": "Autoridades competentes are the authorities responsible for taking swift action against environmental issues such as illegal deforestation and pollution.", "etype": "organization", "degree": 2, "color": "#b0b0b0"}, "Relatório Anual de Monitoramento": {"desc": "Relatório Anual de Monitoramento is an annual report created to assess indicators and project progress, compiling ecological and socioeconomic data.", "etype": "report", "degree": 1, "color": "#D5D0C8"}, "Monitoramento": {"desc": "Monitoramento refers to the ongoing process of observing and assessing the condition of the restored area, including the survival rates of planted seedlings and the control of invasive species.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Remoção de Espécies Invasoras": {"desc": "Remoção de espécies invasoras is a method of immediate removal of invasive species to protect local plant life and ecosystem balance.", "etype": "method", "degree": 0, "color": "#85929E"}, "Desmatamento Ilegal": {"desc": "Desmatamento ilegal refers to illegal deforestation activities that threaten the local environment and are reported by the community.", "etype": "concept", "degree": 0, "color": "#95A5A6"}, "Vigilância Comunitária": {"desc": "Vigilância comunitária refers to the community vigilance effort in monitoring environmental issues, aiming to ensure the protection of the mangrove area.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Guardiões do Manguezal": {"desc": "Guardiões do Manguezal are participants in the PSA project acting as guardians of the mangrove, responsible for cleaning, data collection, and informal monitoring.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Duração de Longo Prazo": {"desc": "Duração de Longo Prazo refers to the long-term commitment of the PSA arrangement, ideally lasting three years with renewal possibilities.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Famílias Locais": {"desc": "Famílias Locais refers to local families selected to participate in the PSA project, especially those dependent on the mangrove ecosystem.", "etype": "concept", "degree": 5, "color": "#95A5A6"}, "Pescadores Artesanais": {"desc": "Pescadores Artesanais are local artisanal fishermen who are a target group for involvement in the PSA project due to their reliance on the mangrove ecosystem.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Maricultores": {"desc": "Maricultores are local aquaculture practitioners selected to participate in the PSA project, often due to their dependence on marine resources.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Monitor da Prefeitura": {"desc": "Monitor da Prefeitura is a representative from the municipality overseeing and providing guidance to participant families in the PSA project.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Mutirão de Limpeza": {"desc": "Mutirão de Limpeza refers to community cleaning efforts where families participate in environmental maintenance as part of their commitment to the PSA project.", "etype": "event", "degree": 1, "color": "#E59866"}, "PSA Municipal": {"desc": "The PSA Municipal refers to the legal framework that ensures the long-term conservation and management of specific areas in the municipality for at least 30 years.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "UC": {"desc": "The UC (Unidade de Conservação) is the conservation unit referenced in the project aimed at maintaining ecological balance and environmental protection.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "SocialCarbon": {"desc": "SocialCarbon is an international carbon standard created in Brazil to facilitate the issuance of verifiable carbon credits while focusing on socio-environmental benefits.<SEP>SocialCarbon is an independent entity involved in the certification of carbon credits related to environmental projects.<SEP>SocialCarbon is a methodology referenced for its applicability in areas of ecological conservation and carbon capture.", "etype": "method", "degree": 6, "color": "#85929E"}, "SCM003": {"desc": "SCM003 is a specific methodology under SocialCarbon aimed at projects that generate carbon credits in preserved areas, emphasizing community involvement and environmental conservation.", "etype": "method", "degree": 2, "color": "#85929E"}, "PSA Karaguá Vivo": {"desc": "PSA Karaguá Vivo is a community engagement initiative associated with the project that promotes local benefits such as improved fishing and eco-tourism.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "VCS": {"desc": "The VCS (Verified Carbon Standard) is a standard that may be applicable to the project's carbon credit registration, ensuring quality and credibility.<SEP>VCS (Verified Carbon Standard) is an organization that certifies carbon credits for projects aimed at greenhouse gas reduction.", "etype": "organization", "degree": 2, "color": "#b0b0b0"}, "Documento de Concepção do Projeto": {"desc": "Documento de Concepção do Projeto (PDD) is the detailed project document created under the template SCM003, outlining project goals, baseline conditions, and planned conservation activities.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "PSA (Guardiões do Manguezal)": {"desc": "PSA relates to the payment for ecosystem services, benefiting the guardians of the mangrove ecosystem through financial incentives.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Créditos de Carbono": {"desc": "Créditos de Carbono are tradable certificates issued for carbon dioxide equivalent emissions avoided or removed by the project initiatives.<SEP>Créditos de Carbono refers to carbon credits generated from the restoration projects, intended as a financial instrument to support environmental services and conservation.<SEP>Créditos de Carbono refers to carbon credits generated and sold by the project to support environmental sustainability initiatives.<SEP>Créditos de Carbono are tradable certificates representing the right to emit a certain amount of carbon dioxide, with increasing prices reflecting market demand.", "etype": "concept", "degree": 3, "color": "#95A5A6"}, "Relatório de Monitoramento 1": {"desc": "Relatório de Monitoramento 1 is the report compiled from collected data to verify carbon storage and emissions management.", "etype": "content", "degree": 2, "color": "#EBE8E2"}, "Relatório de Verificação": {"desc": "Relatório de Verificação is the report published after each verification, detailing the quantification of carbon and conditions of the mangrove area.", "etype": "content", "degree": 0, "color": "#EBE8E2"}, "Municipal Government": {"desc": "Karaguá Ecotech collaborates with the municipal government to market carbon credits derived from the mangrove project's efforts.", "etype": "unknown", "degree": 1, "color": "#4A5568"}, "NGOs": {"desc": "NGOs refer to non-governmental organizations that partner with the project for environmental support.", "etype": "organization", "degree": 1, "color": "#b0b0b0"}, "Atividades de Restauração": {"desc": "Atividades de Restauração represents the scheduled activities focused on restoring the manguezal over a three-year timeline.", "etype": "event", "degree": 3, "color": "#E59866"}, "Instrumentos Legais": {"desc": "Instrumentos Legais refers to legal instruments like municipal decrees that formalize conservation commitments and provide long-term security.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Projeto de Restauração": {"desc": "Projeto de Restauração is the restoration project aimed at recovering the manguezal and integrating with PSA frameworks for sustainability.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Mês 3–6": {"desc": "Mês 3–6 refers to the initial period of passive restoration actions within the restoration project.", "etype": "timeperiod", "degree": 1, "color": "#7FB3D3"}, "Mês 4–6": {"desc": "Mês 4–6 refers to the period of local PSA implementation and family enrollment in environmental activities.", "etype": "timeperiod", "degree": 0, "color": "#7FB3D3"}, "Mês 5–8": {"desc": "Mês 5–8 refers to the time frame for pilot planting and testing active restoration techniques.", "etype": "timeperiod", "degree": 1, "color": "#7FB3D3"}, "Mês 6": {"desc": "Mês 6 marks the beginning of ecological monitoring and formal assessments of restoration actions.", "etype": "timeperiod", "degree": 1, "color": "#7FB3D3"}, "Mês 6–12": {"desc": "Mês 6–12 refers to the validation period for the carbon project documentation.", "etype": "timeperiod", "degree": 1, "color": "#7FB3D3"}, "Intervenções Hidrológicas": {"desc": "Intervenções Hidrológicas refers to water management actions intended to restore and improve the manguezal ecosystem.<SEP>Intervenções Hidrológicas refers to hydrological interventions aimed at normalizing salinity levels at restoration sites.", "etype": "method", "degree": 2, "color": "#85929E"}, "Canteiro Simples": {"desc": "Canteiro Simples is a simple raised bed for planting that may be constructed for the community nursery.", "etype": "artifact", "degree": 1, "color": "#8E44AD"}, "Ações de Restauração Passiva": {"desc": "Ações de Restauração Passiva refers to initial passive restoration actions planned for the restoration project, scheduled from Month 3 to Month 6.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Equipe do Projeto": {"desc": "Equipe do Projeto refers to the project team involved in carrying out the restoration activities and community engagement.", "etype": "organization", "degree": 1, "color": "#b0b0b0"}, "Auditor Validador": {"desc": "The Auditor Validador is responsible for validating the carbon project during a field visit.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Relatório Anual": {"desc": "Relatório Anual is an annual report summarizing all activities and preliminary results of the carbon restoration project at the end of Ano 1.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Viveiro": {"desc": "The Viveiro is involved in providing sufficient seedlings for the restoration activities during Ano 2.", "etype": "organization", "degree": 1, "color": "#b0b0b0"}, "Controle de Espécies Invasoras": {"desc": "Controle de Espécies Invasoras is a maintenance action to manage invasive species during the restoration process.", "etype": "method", "degree": 1, "color": "#85929E"}, "Mutirões de Plantio": {"desc": "Mutirões de Plantio are community planting events organized to involve local families in restoration efforts.", "etype": "event", "degree": 1, "color": "#E59866"}, "Jovem Cientista do Mangue": {"desc": "Jovem Cientista do Mangue is an educational program aimed at involving students in simple scientific monitoring tasks related to mangrove restoration.", "etype": "program", "degree": 1, "color": "#A04000"}, "Dia do Manguezal": {"desc": "Dia do Manguezal is an annual open event that invites the public to participate in demonstrations and learn about mangrove restoration efforts.", "etype": "event", "degree": 1, "color": "#E59866"}, "Relatório de Monitoramento de Carbono #1": {"desc": "Relatório de Monitoramento de Carbono #1 is a carbon monitoring report prepared for independent audit and validation of carbon credits generated from the restoration project.", "etype": "document", "degree": 1, "color": "#F7F5F0"}, "Carbon Credits": {"desc": "Carbon Credits are financial instruments that represent a reduction of one metric ton of carbon dioxide emissions, expected to be issued in relation to the carbon monitoring from the restoration project.<SEP>Carbon credits are generated through Karaguá's carbon sequestration efforts in mangroves, intended for sale to companies with decarbonization goals.<SEP>Carbon credits represent a permit allowing the holder to emit a certain amount of carbon dioxide or other greenhouse gases, with a focus on reducing emissions.<SEP>Carbon credits are financial instruments representing the reduction of one metric ton of carbon dioxide emissions, which can be generated through environmental projects.<SEP>Carbon credits are units representing a reduction, removal, or sequestration of carbon dioxide, used to help he mangrove ecosystem that is central to the restoration project, which aims to enhance its health and resilience.<SEP>Mangue refers to the mangrove trees that are integral to coastal ecosystems and play a significant role in carbon sequestration and biodiversity.", "etype": "naturalobject", "degree": 4, "color": "#1ABC9C"}, "Evento de Conclusão e Transição": {"desc": "Evento de Conclusão e Transição is a public event organized to present the results of a three-year environmental project and celebrate community involvement in restoration efforts.", "etype": "event", "degree": 1, "color": "#E59866"}, "Banco de Dados": {"desc": "Banco de Dados refers to the database that aggregates thematic maps and data produced for the environmental management project.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Mapas Temáticos": {"desc": "Mapas Temáticos are thematic maps created to document the state of the mangrove coverage before and after restoration interventions.<SEP>Mapas Temáticos are thematic maps produced to illustrate the mangrove area and restoration activities.", "etype": "artifact", "degree": 3, "color": "#8E44AD"}, "Acervo Fotográfico Comparativo": {"desc": "Acervo Fotográfico Comparativo is a collection of comparative photographic evidence documenting the regeneration of the mangrove ecosystem.", "etype": "content", "degree": 1, "color": "#EBE8E2"}, "Prefeitura": {"desc": "Prefeitura represents the municipal government body involved in the conservation efforts and project implementation.", "etype": "organization", "degree": 2, "color": "#b0b0b0"}, "Carbon Credit Resources": {"desc": "Carbon Credit Resources are financial tools that support conservation activities by funding projects that lower carbon emissions.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Banco de Dados Ambiental": {"desc": "Banco de Dados Ambiental is a comprehensive environmental database compiling various ecological data.", "etype": "data", "degree": 2, "color": "#BDC3C7"},
