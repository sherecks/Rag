, "color": "#F7F5F0"}, "Plano de Manejo da APA de Anhatomirim – Encarte 3": {"desc": "This management plan details the structure of programs, zoning, and social participation for a coastal and marine conservation unit.", "etype": "document", "degree": 0, "color": "#F7F5F0"}, "DSA – Diagnóstico Socioambiental de Balneário Barra do Sul": {"desc": "This document provides a territorial and environmental assessment for characterizing the designated protection area and conservation unit, including georeferenced mapping.", "etype": "document", "degree": 0, "color": "#F7F5F0"}, "Framework – Quantificação de Carbono": {"desc": "This technical model focuses on the calculation and certification of carbon credits, including the SocialCarbon methodology and parameters for monitoring, reporting, and verification (MRV).", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Legislação Ambiental Brasileira e Normativas Específicas": {"desc": "This refers to Brazilian environmental legislation and specific norms related to national conservation units and applicable resolutions for effective mangrove ecosystem management.", "etype": "document", "degree": 4, "color": "#F7F5F0"}, "Código Florestal": {"desc": "The Código Florestal is a Brazilian law that establishes guidelines for forestry management and environmental conservation practices.", "etype": "document", "degree": 1, "color": "#F7F5F0"}, "Lei nº 9.985/2000": {"desc": "This law, known as SNUC, defines the national system of conservation units in Brazil.", "etype": "document", "degree": 1, "color": "#F7F5F0"}, "Resoluções CONAMA": {"desc": "Resoluções CONAMA consists of resolutions by the National Environmental Council that apply to permanent preservation areas (APPs) and mangrove ecosystems.", "etype": "document", "degree": 1, "color": "#F7F5F0"}, "Manguezais": {"desc": "Manguezais refers to mangroves, which play a crucial role in the environment and are a focus for restoration and monitoring efforts.<SEP>Manguezais are coastal ecosystems recognized for their key role in carbon sequestration and their importance for biodiversity and traditional livelihoods.<SEP>Manguezais refer to mangrove ecosystems in Brazil, significant for their biodiversity and role in coastal protection and carbon sequestration.<SEP>Manguezais, or mangroves, are coastal ecosystems that are recognized as climate assets under the environmental strategies outlined by various laws and programs in Brazil.<SEP>Manguezais play a crucial role in carbon storage, marine species reproduction, and protecting the coastline against erosion and extreme weather events.", "etype": "naturalobject", "degree": 5, "color": "#1ABC9C"}, "Tecnologia": {"desc": "Tecnologia encompasses the technological advancements utilized in connecting environmental initiatives with community development and education.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Educação": {"desc": "Educação refers to the educational aspects involved in community development and environmental awareness related to mangroves and sustainability.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Desenvolvimento Comunitário": {"desc": "Desenvolvimento Comunitário focuses on community development efforts aimed at improving the quality of life through environmental initiatives.", "etype": "concept", "degree": 0, "color": "#95A5A6"}, "Karaguá": {"desc": "Karaguá is an organization that promotes integrated financial returns, nature restoration, data generation, social impact, and territorial transformation.", "etype": "organization", "degree": 10, "color": "#b0b0b0"}, "Retorno Financeiro": {"desc": "Retorno Financeiro refers to the financial returns that are part of the investment model promoted by Karaguá, integrating economic and environmental goals.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Restauração da Natureza": {"desc": "Restauração da Natureza represents the nature restoration efforts emphasized by Karaguá as a key component of its initiatives.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Geração de Dados": {"desc": "Geração de Dados pertains to the data generation aspect of Karaguá's model, which is crucial for measuring impact and success in conservation efforts.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Impacto Social": {"desc": "Impacto Social is the social impact targeted by Karaguá, highlighting the importance of community involvement and benefits from environmental initiatives.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Transformação Territorial": {"desc": "Transformação Territorial refers to the territorial transformation that Karaguá seeks through its comprehensive model, aiming for sustainable community development.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "ProManguezal": {"desc": "ProManguezal is a national program established in 2024 in Brazil aimed at the conservation, recovery, and sustainable use of mangrove territories.<SEP>ProManguezal is a national conservation program in Brazil aimed at sustainable use of mangrove ecosystems, established through a federal decree.<SEP>ProManguezal is a policy established by Decreto nº 12.045/2024 in Brazil that sets guidelines for the conservation and sustainable use of mangrove environments.<SEP>ProManguezal is a national program established to promote the conservation and sustainable use of Brazilian mangroves, formalized by Decreto nº 12.045/2024.<SEP>ProManguezal, established by Decree nº 12.045/2024, sets national guidelines for the conservation and sustainable use of mangroves.", "etype": "legalregulation", "degree": 4, "color": "#4A5568"}, "Política Estadual de Serviços Ambientais de Santa Catarina": {"desc": "This state policy in Santa Catarina aligns with the payment for environmental services framework, contributing to sustainable development efforts.", "etype": "concept", "degree": 0, "color": "#95A5A6"}, "Programa Estadual de Pagamento por Serviços Ambientais (PEPSA)": {"desc": "PEPSA is a program established by law in Santa Catarina, promoting sustainable development through payment for environmental services.<SEP>PEPSA is a state program in Santa Catarina that facilitates payment for environmental services.", "etype": "program", "degree": 1, "color": "#A04000"}, "BLUE": {"desc": "BLUE is a methodology utilized by Karaguá Ecotech in structuring carbon credits in coastal areas, particularly in mangroves.", "etype": "method", "degree": 1, "color": "#85929E"}, "REDD++": {"desc": "REDD++ is a methodology used for reducing emissions from deforestation and forest degradation, which is part of the approach employed by Karaguá Ecotech.", "etype": "method", "degree": 1, "color": "#85929E"}, "50% of Baía da Babitonga": {"desc": "The goal of Karaguá Ecotech is to impact 50% of Baía da Babitonga by 2035, benefiting over 400 families in that region.", "etype": "data", "degree": 0, "color": "#BDC3C7"}, "Fase 2": {"desc": "Fase 2 refers to the stage in the project focused on selecting priority areas for planting and restoration, providing training, and remunerating participants.", "etype": "event", "degree": 1, "color": "#E59866"}, "Joinville": {"desc": "Joinville is a city where part of the project takes place, especially in collaboration with UDESC and Univille for academic partnerships.", "etype": "location", "degree": 1, "color": "#52BE80"}, "Laboratório Comunitário de Impressão 3D": {"desc": "The Laboratório Comunitário de Impressão 3D is a community project aimed at providing practical education and innovation opportunities related to 3D printing.<SEP>The Laboratório Comunitário de Impressão 3D is a community lab maintained by Karaguá Ecotech in Balneário Barra do Sul, aimed at fostering technological development.<SEP>The 3D Printing Community Laboratory is a project by Karaguá Ecotech aimed at accessible technological education for the community in Balneário Barra do Sul.", "etype": "project", "degree": 3, "color": "#adbc25"}, "Fundo Clima": {"desc": "Fundo Clima is a fund aimed at supporting projects related to climate change mitigation and associated with the BNDES.<SEP>Fundo Clima is a climate fund that provides financing for carbon credit operations with specific conditions.<SEP>Fundo Clima is an instrument of Brazil's National Policy on Climate Change (PNMC) that finances projects aimed at reducing greenhouse gas emissions.", "etype": "concept", "degree": 6, "color": "#95A5A6"}, "Salic": {"desc": "Salic is the official system used by the Ministry of Culture for project submission, management, and monitoring related to cultural sponsorship.<SEP>Salic is the official submission system for projects seeking financing through Lei Rouanet.<SEP>Salic is a system for the submission and management of projects that seek funding under the Ley Rouanet in Brazil.<SEP>Salic is the official system for submitting, monitoring, and managing cultural projects under the Lei Rouanet.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Gabriela": {"desc": "Gabriela is one of the engineers responsible for studies and technical analyses in the Karaguá Ecotech project.<SEP>Gabriela is an engineer involved in environmental characterization studies and supervision of monitoring technologies.<SEP>Gabriela is an engineer responsible for environmental characterization studies of mangrove areas and oversees monitoring technologies.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Carol": {"desc": "Carol is an engineer involved in the research and development efforts related to the project at Karaguá Ecotech.<SEP>Carol is an engineer responsible for technical analyses that support the certification of carbon credits.<SEP>Carol is an engineer who conducts technical analyses to support the certification of carbon credits in collaboration with Verra.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Sabrina": {"desc": "Sabrina is an engineer who plays a significant role in conducting studies and analyses for the Karaguá Ecotech initiative.<SEP>Sabrina is an engineer conducting scientific and operational field surveys.<SEP>Sabrina is an engineer leading scientific and operational field surveys, including assessments of priority areas for restoration.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Credenciais de Carbono Azul": {"desc": "Credenciais de Carbono Azul refers to the blue carbon credits generated through the conservation and restoration of mangrove ecosystems for sustainability initiatives.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Santa Catarina": {"desc": "Santa Catarina is a state in Brazil where Karaguá Ecotech operates its projects related to Carbon Blue and mangrove restoration.<SEP>Santa Catarina is a Brazilian state that has legislation (Lei nº 15.133/2010) recognizing Payment for Environmental Services (PSA) as a tool for sustainable development.<SEP>Santa Catarina is a state in Brazil where Karaguá Ecotech operates, particularly in carbon credit projects.", "etype": "location", "degree": 2, "color": "#52BE80"}, "Mangroves": {"desc": "Mangroves are coastal environments vital for carbon sequestration and provide numerous ecological benefits; they are the focus of Karaguá's projects.<SEP>Mangroves are coastal ecosystems that the project focuses on for restoration and monitoring activities.", "etype": "naturalobject", "degree": 2, "color": "#1ABC9C"}, "BNDES Fundo Clima": {"desc": "BNDES Fundo Clima is a financial fund that supports the operation of carbon credits within the context of Karaguá’s initiatives.<SEP>BNDES Fundo Clima is a Brazilian climate fund offering financial support for sustainable projects, including those related to blue carbon.", "etype": "organization", "degree": 1, "color": "#b0b0b0"}, "Lei nº 15.133/2010": {"desc": "Lei nº 15.133/2010 is a state law that underpins the Payment for Environmental Services mechanisms employed by Karaguá to compensate local communities.<SEP>Lei nº 15.133/2010 is a state law in Santa Catarina that establishes the Política Estadual de Serviços Ambientais and the Programa Estadual de Pagamento por Serviços Ambientais (PEPSA).<SEP>Lei nº 15.133/2010 provides the legal framework for the Environmental Services Policy in SC and co-responsibility between public and private agents.<SEP>Lei nº 15.133/2010 establishes the State Policy on Environmental Services in Santa Catarina and recognizes PSA as a tool for sustainable development.", "etype": "legalregulation", "degree": 3, "color": "#4A5568"}, "Global Carbon Market": {"desc": "The Global Carbon Market refers to the international trading system for carbon credits, which experienced significant transactions and pricing trends in 2025.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Credits de Carbono Azul": {"desc": "Credits de Carbono Azul are carbon credits generated from coastal ecosystems, recognized for their high storage capacity and socio-environmental co-benefits.", "etype": "concept", "degree": 3, "color": "#95A5A6"}, "Lei nº 15.042/2024": {"desc": "Lei nº 15.042/2024 is Brazilian legislation that establishes a legal framework for a regulated carbon market in Brazil.<SEP>Lei nº 15.042/2024 is a law that established the regulatory framework for the Brazilian carbon market.<SEP>Lei nº 15.042/2024 is a Brazilian law that establishes the Sistema Brasileiro de Comércio de Emissões de Gases de Efeito Estufa, regulating the carbon market.<SEP>Lei nº 15.042/2024 creates a regulated carbon market in Brazil, impacting how carbon credits are managed and traded.", "etype": "legalregulation", "degree": 2, "color": "#4A5568"}, "1,04 Bilhão de Dólares": {"desc": "1,04 Bilhão de Dólares refers to the estimated transaction volume of the voluntary carbon market in 2025.", "etype": "data", "degree": 0, "color": "#BDC3C7"}, "R$ 42,5 Bilhões": {"desc": "R$ 42,5 Bilhões represents the authorized funding amount from the BNDES for projects in 2026, available at a cost of 1% per year.<SEP>R$ 42,5 bilhões is the amount authorized by the Annual Budget Law for 2026, of which R$ 27 bilhões are allocated for loans.", "etype": "data", "degree": 2, "color": "#BDC3C7"}, "Mercado Voluntário de Carbono": {"desc": "The Mercado Voluntário de Carbono is a voluntary carbon market where companies buy carbon credits on their initiative to offset emissions.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Brazilian Government": {"desc": "The Brazilian government established ProManguezal as a national program for conserving and sustainably using mangrove ecosystems in June 2024.", "etype": "unknown", "degree": 1, "color": "#4A5568"}, "Manguezais Brasileiros": {"desc": "Manguezais Brasileiros are coastal ecosystems that store significant amounts of carbon and support numerous families, but lack economic returns for local residents.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "VM0033": {"desc": "VM0033 is an internationally recognized methodology for certifying carbon credits in coastal environments, specifically aimed at blue carbon initiatives.<SEP>VM0033 is a methodology for blue carbon certification used by Karaguá Ecotech.<SEP>VM0033 is a methodology for blue carbon accounting, applicable to the restoration of coastal wetlands.<SEP>VM0033 is a methodology recognized by Verra that supports the projects implemented by Karaguá Ecotech.", "etype": "method", "degree": 2, "color": "#85929E"}, "VM0007/REDD+": {"desc": "VM0007/REDD+ is another internationally recognized methodology utilized for certifying carbon credits, supporting sustainable forestry and conservation efforts.", "etype": "method", "degree": 0, "color": "#85929E"}, "CRÉDITOS DE CARBONO": {"desc": "The Baía da Babitonga represents a market potential for selling carbon credits derived from its extensive mangrove ecosystem.", "etype": "unknown", "degree": 1, "color": "#4A5568"}, "Créditos de Carbono Azul": {"desc": "Blue carbon credits represent one ton of CO₂ equivalent that has been reduced, removed, or sequestered, and are a primary product of Karaguá Ecotech.<SEP>Créditos de Carbono Azul represents funding for carbon credit projects associated with blue carbon ecosystems.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "VM0007": {"desc": "VM0007 is a REDD+ methodology used by Karaguá Ecotech for carbon credit certification.<SEP>VM0007 is the REDD+ methodology framework by Verra, initially focused on reducing emissions from deforestation and forest degradation.<SEP>VM0007 is a Verra methodology relevant to the carbon credit projects conducted by Karaguá Ecotech.", "etype": "method", "degree": 2, "color": "#85929E"}, "BNDES": {"desc": "BNDES is a Brazilian development bank through which Karaguá Ecotech seeks funding via the Fundo Clima.<SEP>BNDES is the Brazilian Development Bank that manages the Fundo Clima and provides financing for climate-related projects.<SEP>BNDES is the Brazilian Development Bank, which is expected to provide funding for Karaguá Ecotech's expansion via the Climate Fund.", "etype": "organization", "degree": 2, "color": "#b0b0b0"}, "Lei Estadual nº 15.133/2010": {"desc": "This state law regulates payment for environmental services and supports the community's involvement in environmental monitoring and restoration.", "etype": "content", "degree": 0, "color": "#EBE8E2"}, "Lei Rouanet": {"desc": "Lei Rouanet is a Brazilian law that provides tax incentives for cultural projects and supports funding through Salic.<SEP>Lei Rouanet is the primary tax incentive mechanism for culture in Brazil, enabling projects to attract resources from companies.", "etype": "concept", "degree": 3, "color": "#95A5A6"}, "Municipalities": {"desc": "Municipalities participate as partners in Karaguá Ecotech's model, receiving a share of the revenue generated from carbon credit sales.<SEP>Municipalities are local government entities mentioned as partners in the Karaguá Ecotech project.", "etype": "group", "degree": 2, "color": "#adbc25"}, "Municípios": {"desc": "Municípios refers to the municipalities that participate and share in the revenue of the carbon credit project, enhancing their role in governance and conservation efforts.", "etype": "location", "degree": 0, "color": "#52BE80"}, "Modelo de Negócio": {"desc": "Modelo de Negócio outlines Karaguá Ecotech's business model that integrates environmental conservation with community involvement and revenue generation.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Ley Rouanet": {"desc": "Ley Rouanet is a Brazilian law that encourages cultural development through tax incentives for cultural projects, applicable to the funding of the 3D printing laboratory project.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Ministério da Cultura": {"desc": "The Ministry of Culture in Brazil is responsible for approving projects that seek funding under the Ley Rouanet.<SEP>Ministério da Cultura is the Brazilian government ministry responsible for approving projects under Lei Rouanet.", "etype": "organization", "degree": 2, "color": "#b0b0b0"}, "Créditos": {"desc": "Créditos refer to the environmental credits generated through the local care network and monitoring work conducted by participants of the Karaguá Vivo program.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Plataforma Digital Pública": {"desc": "The Plataforma Digital Pública is a future public digital platform intended to synthesize and display data related to environmental monitoring from the Karaguá Vivo program.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Mangrove Area": {"desc": "The mangrove area in Baía da Babitonga is estimated between 6,000 and 8,000 hectares and is critically important for biodiversity and ecological balance.", "etype": "naturalobject", "degree": 1, "color": "#1ABC9C"}, "Toninha": {"desc": "Toninha is a threatened species, known scientifically as Pontoporia blainvillei, found in the habitat of Baía da Babitonga.<SEP>Toninha is an endangered marine species that reproduces in the estuary of Baía da Babitonga.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Boto-Cinza": {"desc": "Boto-Cinza, or Sotalia guianensis, is a threatened species that inhabits the waters of Baía da Babitonga.<SEP>Boto-Cinza is an endangered marine species found in the Baía da Babitonga.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Tartaruga-Verde": {"desc": "Tartaruga-Verde, or Chelonia mydas, is a threatened turtle species that is part of the ecosystem in Baía da Babitonga.<SEP>Tartaruga-Verde is an endangered turtle species that inhabits the Baía da Babitonga.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Mero": {"desc": "Mero, or Epinephelus itajara, is a threatened fish species found in the Baía da Babitonga's habitat.<SEP>Mero is an endangered fish species that is also found in the Baía da Babitonga.", "etype": "creature", "degree": 1, "color": "#2ECC71"}, "Ecosystem Services": {"desc": "Ecosystem services refer to the benefits provided by natural environments, which in this case include a financial estimate for estuarine areas.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Mapa de Declaração de Segurança Ambiental": {"desc": "Mapa de Declaração de Segurança Ambiental is a document that validated the location choice for the project's operation by analyzing environmental conditions.", "etype": "content", "degree": 1, "color": "#EBE8E2"}, "Grupo Pro Babitonga": {"desc": "Grupo Pro Babitonga is an organization that provides data on the ecosystem of Baía da Babitonga.", "etype": "organization", "degree": 1, "color": "#b0b0b0"}, "Revista CEPSUL / ICMBio": {"desc": "Revista CEPSUL / ICMBio is a publication that includes an analysis titled \"Os manguezais e marismas da Baía Babitonga: uma síntese.\"", "etype": "content", "degree": 1, "color": "#EBE8E2"}, "NSC Total": {"desc": "NSC Total is a media organization that reported on Baía da Babitonga, highlighting issues and developments in the area.", "etype": "organization", "degree": 1, "color": "#b0b0b0"}, "Verra": {"desc": "Verra is the organization that manages the Verified Carbon Standard and provides methodologies for carbon credit certification.<SEP>Verra is an organization that develops methodologies (VM0033 and VM0007) for carbon credit certification.", "etype": "organization", "degree": 4, "color": "#b0b0b0"}, "Creditos de Carbono": {"desc": "Credits de Carbono refer to the tradable certificates that represent the right to emit one ton of carbon dioxide or its equivalent in other greenhouse gases.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "PEPSA": {"desc": "PEPSA is the Programa Estadual de Pagamento por Serviços Ambientais, designed to finance conservation and environmental monitoring activities.<SEP>PEPSA refers to the State Policy of Environmental Services in Santa Catarina, which supports the conservation project.<SEP>PEPSA refers to the environmental legislation of Brazil related to Payments for Environmental Services.", "etype": "concept", "degree": 2, "color": "#95A5A6"}, "Luiz Inácio Lula da Silva": {"desc": "Luiz Inácio Lula da Silva is the president of Brazil who signed the ProManguezal decree on June 5, 2024.", "etype": "person", "degree": 1, "color": "#E85D4A"}, "Declaração de Segurança Ambiental de Balneário Barra do Sul": {"desc": "The Declaração de Segurança Ambiental de Balneário Barra do Sul is an environmental safety declaration that guided the operational planning of Karaguá's project.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Programa Estadual de Pagamento por Serviços Ambientais": {"desc": "Programa Estadual de Pagamento por Serviços Ambientais is a program created by Lei nº 15.133/2010, focusing on funding for environmental services and community remuneration.", "etype": "program", "degree": 1, "color": "#A04000"}, "PNMC": {"desc": "PNMC stands for the National Policy on Climate Change in Brazil, which guides climate financing initiatives.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Laboratório de Impressão 3D": {"desc": "Laboratório de Impressão 3D refers to a community laboratory project aimed at technological education and waste repurposing.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "R$ 400 Milhões": {"desc": "R$ 400 milhões represents the average annual funding available through the Fundo Clima between 2010 and 2023.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "R$ 25 Bilhões": {"desc": "R$ 25 bilhões is the amount reached by the Fundo Clima’s portfolio for the biennium 2024/2025.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Empréstimos": {"desc": "Empréstimos refers to loans that are part of the funding structure for projects under the Fundo Clima.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Lei Orçamentária Anual": {"desc": "The Lei Orçamentária Anual authorized R$ 42,5 bilhões for the Fundo Clima in 2026, indicating projected support for climate initiatives.", "etype": "unknown", "degree": 1, "color": "#4A5568"}, "PSA Mechanism": {"desc": "The PSA mechanism connects environmental operations with income generation for local residents and fishermen.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Local Residents and Fishermen": {"desc": "The PSA mechanism involves local residents and fishermen being compensated for their involvement in monitoring and restoration efforts.", "etype": "unknown", "degree": 1, "color": "#4A5568"}, "Communities of Fishermen": {"desc": "Communities of fishermen are identified as stakeholders involved in the project with Karaguá Ecotech.", "etype": "group", "degree": 1, "color": "#adbc25"}, "Credits de Carbono": {"desc": "Credits de Carbono are carbon credits certified through methodologies that support environmental conservation and restoration efforts.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Equipe Técnica": {"desc": "Equipe Técnica refers to the scientific and operational team responsible for the environmental studies and monitoring in the Karaguá Ecotech project.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Monitoramento Contínuo": {"desc": "Monitoramento Contínuo is a continuous monitoring approach applied by the technical team for environmental data collection and restoration efforts.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Restauracão": {"desc": "Restauracão refers to the efforts made by the Karaguá Ecotech project to restore mangrove ecosystems.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Participação Comunitária": {"desc": "Participação Comunitária denotes the involvement of local residents and fishermen in monitoring and restoration activities of the project.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Fase 1 - Piloto em Balneário Barra do Sul": {"desc": "Fase 1 refers to the initial phase of Karaguá Ecotech's project focusing on validating the operational model in Balneário Barra do Sul.", "etype": "event", "degree": 1, "color": "#E59866"}, "Fase 2 - Restauração ativa": {"desc": "Fase 2 signifies the active restoration phase following the pilot, focusing on planting and training local stakeholders.", "etype": "event", "degree": 1, "color": "#E59866"}, "Fase 3 - Escala para a Baía da Babitonga": {"desc": "Fase 3 is the scaling phase of the project aimed at replicating the successful model across Baía da Babitonga.", "etype": "event", "degree": 1, "color": "#E59866"}, "Fase 4 - Plataforma digital pública": {"desc": "Fase 4 involves the future launch of a public digital platform for centralized access to generated project data.", "etype": "event", "degree": 1, "color": "#E59866"}, "R$ 1,2 milhão": {"desc": "R$ 1,2 milhão is specified as the annual revenue target in carbon credits based on the project’s financial projections.", "etype": "data", "degree": 1, "color": "#BDC3C7"}, "Babitonga": {"desc": "Baía da Babitonga is an area in Santa Catarina identified for the company's expansion.", "etype": "location", "degree": 1, "color": "#52BE80"}, "Blue Carbon": {"desc": "Blue Carbon refers to carbon stored and sequestered in coastal and marine environments such as mangroves, marshes, and seagrass meadows, which have a high capacity for CO₂ capture.", "etype": "concept", "degree": 1, "color": "#95A5A6"}, "Payment for Environmental Services (PSA)": {"desc": "PSA is a mechanism that directly compensates individuals and groups for conservation, recovery, or improvement of natural environments, implemented at Karaguá for monitoring and restoring mangroves.", "etype": "method", "degree": 1, "color": "#85929E"}, "ESG Strategies": {"desc": "ESG Strategies are corporate approaches towards environmental sustainability, social responsibility, and governance, which involve buying blue carbon credits to offset emissions.", "etype": "concept", "degree": 1, "color": "#95A5A6"}};

<script>
window.addEventListener('load', function() {
  if (typeof network === 'undefined') return;

  // ── Clique no nó: abre painel de detalhe ──
  network.on('click', function(params) {
    if (params.nodes.length > 0) {
      var nodeId = params.nodes[0];
      var d = NODE_DATA[nodeId];
      if (!d) return;
      document.getElementById('k-detail-name').textContent     = nodeId;
      document.getElementById('k-detail-type').textContent     = d.etype;
      document.getElementById('k-detail-degree').textContent   = d.degree + ' conexões';
      document.getElementById('k-detail-desc').textContent     = d.desc || '—';
      document.getElementById('k-detail-dot').style.background = d.color;
      document.getElementById('k-detail').classList.add('open');
    } else {
      closeDetail();
    }
  });

  // ── Edges pontilhadas no hover / seleção ──
  var _selectedNode = null;
  var _hoveredNode  = null;
  var _dashedIds    = [];

  function applyDashes(nodeId) {
    if (_dashedIds.length) {
      network.body.data.edges.update(
        _dashedIds.map(function(id) {
          return { id: id, dashes: false, color: { color: '#253447', opacity: 0.7 } };
        })
      );
      _dashedIds = [];
    }
    if (nodeId === null) return;
    _dashedIds = network.getConnectedEdges(nodeId);
    network.body.data.edges.update(
      _dashedIds.map(function(id) {
        return { id: id, dashes: [6, 4], color: { color: '#7EB8D4', opacity: 1 } };
      })
    );
  }

  network.on('selectNode',   function(p) { _selectedNode = p.nodes[0]; applyDashes(_selectedNode); });
  network.on('deselectNode', function()  { _selectedNode = null;        applyDashes(_hoveredNode);  });
  network.on('hoverNode',    function(p) { _hoveredNode  = p.node;  if (!_selectedNode) applyDashes(_hoveredNode); });
  network.on('blurNode',     function()  { _hoveredNode  = null;    if (!_selectedNode) applyDashes(null); });
});

function closeDetail() {
  document.getElementById('k-detail').classList.remove('open');
}
</script>
